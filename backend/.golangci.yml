# golangci-lint v2 configuration. Run with `make lint` (uses the pinned Docker image).
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose     # HTTP response bodies must be closed
    - errorlint     # compare wrapped errors with errors.Is / errors.As
    - gosec         # common security mistakes
    - misspell
    - noctx         # outgoing HTTP requests need a context
    - revive        # style: exported names documented, naming
    - sloglint      # consistent structured logging
    - unconvert
    - unparam
    - usestdlibvars # http.MethodGet instead of "GET", etc.
  settings:
    sloglint:
      attr-only: true # slog.String("k", v), never loose key/value pairs
      context: scope  # use the *Context variants when a context is available
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, noctx, bodyclose]
      # -healthcheck calls http://127.0.0.1:<port>/readyz inside the container; the
      # port comes from HTTP_ADDR and is checked to be 1-65535. A fixed loopback
      # host cannot be steered elsewhere, so this is not server-side request forgery.
      - path: cmd/api/main\.go
        linters: [gosec]
        text: "G704"

formatters:
  enable:
    - gofmt
    - goimports
