openapi: 3.1.0
info:
  title: Addis Hiwot API
  version: 0.1.0
  summary: Backend of Addis Hiwot, a recovery and mental-health companion app.
  description: |
    Conventions every endpoint follows:

    - **JSON only.** Request bodies must be `Content-Type: application/json`, at most 64 KB, one JSON
      object, with no fields the endpoint does not define.
    - **Errors** always use the same envelope (`ErrorEnvelope`). Clients act on `error.code`, never on
      `error.message`; quote `error.request_id` when reporting a problem.
    - **Request IDs.** Every response has an `X-Request-ID` header. A client may send its own (letters,
      digits, `.`, `_`, `-`, up to 64 characters); other values are replaced.
    - **Lists** use cursor pagination: `?limit=` (1–100, default 20) and `?cursor=` taken from the previous
      response's `next_cursor`, which is `null` on the last page.
servers:
  - url: http://127.0.0.1:8080
    description: Local development (make up)
tags:
  - name: health
    description: Liveness and readiness for Docker and load balancers.
  - name: auth
    description: |
      Sign-up, login and sessions. Passwords are hashed with Argon2id (m=19 MiB, t=2, p=1).
      Login returns a short-lived access token (JWT, 15 minutes) and a refresh token (30 days). Each refresh
      returns a new pair and the old refresh token stops working; presenting an old one again ends the whole
      session (someone copied it), so the user must log in again.
  - name: users
    description: The logged-in user's account.

paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Is the process alive?
      description: Answers 200 while the process can answer at all. It does not check the database.
      security: []
      responses:
        "200":
          description: The process is alive.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Liveness" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Can the instance serve requests?
      description: 200 when the database answers within 2 seconds and the instance is not shutting down.
      security: []
      responses:
        "200":
          description: Ready.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
              example: { status: ok, database: up }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "503":
          description: Not ready; send no traffic. `status` is `unavailable` or `shutting_down`.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestID" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Readiness" }
              example: { status: unavailable, database: down }

  /v1/auth/signup:
    post:
      tags: [auth]
      operationId: signup
      summary: Create an account.
      description: |
        Answers **202 with the same body** whether the email was new or already registered, so this
        endpoint cannot be used to find out who uses Addis Hiwot; an already-registered email creates
        nothing. A taken **username** is reported (422, `username_taken`), because people must pick another.
        The 18+ confirmation and terms acceptance are stored with their time and the terms version.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignupRequest" }
      responses:
        "202":
          description: Accepted; the app shows the email-code screen.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email or username and password.
      description: |
        An `identifier` containing `@` is an email, anything else a username (usernames never contain `@`).
        A missing account, a Google-only account and a wrong password all give the same 401
        `INVALID_CREDENTIALS` after the same hashing work. Starts a session and returns its tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: "Logged in. Sent with `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                type: object
                required: [user, tokens]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  tokens: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Wrong email, username or password (INVALID_CREDENTIALS).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "500": { $ref: "#/components/responses/Internal" }

  /v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Verify the email with the 5-digit code, and log in.
      description: |
        The code from the newest email works for 10 minutes and 5 attempts. A wrong, expired, used-up or
        replaced code, and an email without an account, all answer the same 400 INVALID_CODE, so this
        endpoint cannot be used to find out who has an account. On success the email is verified and a
        session starts.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyEmailRequest" }
      responses:
        "200":
          description: "Verified and logged in. Sent with `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                type: object
                required: [user, tokens]
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  tokens: { $ref: "#/components/schemas/Tokens" }
        "400":
          description: Wrong or expired code (INVALID_CODE), or a malformed body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/auth/resend-code:
    post:
      tags: [auth]
      operationId: resendCode
      summary: Email a new verification code.
      description: |
        Always answers 202 with the same body as sign-up, whether or not the email has an unverified account.
        At most 5 codes per account per hour; a new code replaces the previous one.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendCodeRequest" }
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignupAccepted" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Exchange a refresh token for a new access and refresh token.
      description: |
        The refresh token sent can never be used again. If an already-used refresh token is sent, the whole
        session is ended and every token of it stops working. Any failure answers 401 INVALID_REFRESH_TOKEN:
        the app should send the user to the login screen.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: "New tokens. Sent with `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens: { $ref: "#/components/schemas/Tokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Unknown, expired, reused or ended refresh token (INVALID_REFRESH_TOKEN).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorEnvelope" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session of a refresh token.
      description: Always 204, also for an unknown or already ended session, so it can be retried safely.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: The session is ended. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/Internal" }
  /v1/me:
    get:
      tags: [users]
      operationId: getMe
      summary: The logged-in user's account.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: "The account. Sent with `Cache-Control: no-store`."
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/Internal" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "The access token from login or refresh, in `Authorization: Bearer <token>`."

  headers:
    RequestID:
      description: The request's ID; also in every log line and error body for this request.
      schema: { type: string, pattern: "^[A-Za-z0-9._-]{1,64}$" }

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page's `next_cursor`. Leave out for the first page.
      schema: { type: string }

  schemas:
    Liveness:
      type: object
      required: [status]
      properties:
        status: { type: string, const: ok }
    Readiness:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, unavailable, shutting_down] }
        database: { type: string, enum: [up, down] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code:
              type: string
              description: Stable machine-readable code.
              enum: [BAD_JSON, EMPTY_BODY, UNKNOWN_FIELD, BODY_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE,
                     VALIDATION_FAILED, BAD_CURSOR, NOT_FOUND, METHOD_NOT_ALLOWED, INTERNAL,
                     INVALID_CREDENTIALS, INVALID_REFRESH_TOKEN, UNAUTHENTICATED, TOKEN_EXPIRED, INVALID_TOKEN,
                     INVALID_CODE, RATE_LIMITED]
            message:
              type: string
              description: English explanation for developers and logs; not shown to users as is.
            request_id: { type: string }
            fields:
              type: array
              description: Present only with VALIDATION_FAILED, one entry per invalid field, sorted by field.
              items: { $ref: "#/components/schemas/FieldError" }
    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string, examples: [email] }
        code: { type: string, description: Machine code the app translates, examples: [invalid_email] }
        message: { type: string, examples: [must be an email address] }
    SignupRequest:
      type: object
      additionalProperties: false
      required: [username, email, password, is_adult, accept_terms]
      properties:
        username:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_.]{2,19}$"
          description: 3–20 letters, digits, `_` or `.`, starting with a letter; unique in any letter case.
        email: { type: string, format: email, maxLength: 254 }
        password:
          type: string
          minLength: 8
          maxLength: 128
          description: >-
            8–128 characters (an Amharic letter counts as one); not a very common password and not
            containing the username or the email name. Codes: too_short, too_long, too_common,
            contains_username, contains_email.
        is_adult: { type: boolean, description: Must be true (must_be_adult). }
        accept_terms: { type: boolean, description: Must be true (must_accept_terms). }
        locale: { type: string, enum: [en, am], default: en }
    SignupAccepted:
      type: object
      required: [status, message]
      properties:
        status: { type: string, const: verification_pending }
        message: { type: string }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [identifier, password]
      properties:
        identifier: { type: string, description: Email or username. }
        password: { type: string }
    User:
      type: object
      required: [id, username, email, display_name, locale, timezone, email_verified, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        locale: { type: string, enum: [en, am] }
        timezone: { type: string, examples: [Africa/Addis_Ababa] }
        email_verified: { type: boolean, description: False until the email code was entered. }
        created_at: { type: string, format: date-time }
    Tokens:
      type: object
      required: [token_type, access_token, access_token_expires_at, refresh_token, refresh_token_expires_at]
      properties:
        token_type: { type: string, const: Bearer }
        access_token: { type: string, description: "JWT; send as `Authorization: Bearer <token>`." }
        access_token_expires_at: { type: string, format: date-time }
        refresh_token: { type: string, description: Opaque; store securely on the device. }
        refresh_token_expires_at: { type: string, format: date-time }
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [email, code]
      properties:
        email: { type: string, format: email }
        code: { type: string, pattern: "^[0-9]{5}$" }
    ResendCodeRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, format: email }
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    PageInfo:
      description: Every list response has `items` plus this field.
      type: object
      required: [next_cursor]
      properties:
        next_cursor:
          type: [string, "null"]
          description: Pass as `?cursor=` to get the next page; `null` on the last page.

  responses:
    TooManyRequests:
      description: Too many requests from this IP or for this account (RATE_LIMITED); wait Retry-After seconds.
      headers:
        Retry-After:
          description: Seconds to wait before trying again.
          schema: { type: integer, minimum: 1 }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Unauthorized:
      description: |
        No valid access token. `UNAUTHENTICATED`: none was sent. `TOKEN_EXPIRED`: refresh, then retry.
        `INVALID_TOKEN`: malformed or not issued by us; log in again. Has a `WWW-Authenticate: Bearer` header.
      headers:
        WWW-Authenticate:
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    BadRequest:
      description: Malformed body (BAD_JSON, EMPTY_BODY, UNKNOWN_FIELD) or bad cursor (BAD_CURSOR).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    ValidationFailed:
      description: One or more fields are invalid (VALIDATION_FAILED, with `fields`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
          example:
            error:
              code: VALIDATION_FAILED
              message: Some fields are not valid.
              request_id: 0f3c2a9b6d8e4f1a9c7b5e3d2a1f0e9d
              fields:
                - { field: email, code: invalid_email, message: must be an email address }
    PayloadTooLarge:
      description: The body is over 64 KB (BODY_TOO_LARGE).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    UnsupportedMediaType:
      description: The body is not application/json (UNSUPPORTED_MEDIA_TYPE).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    NotFound:
      description: No such endpoint or resource (NOT_FOUND).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    MethodNotAllowed:
      description: The endpoint exists but not for this method (METHOD_NOT_ALLOWED); see the Allow header.
      headers:
        Allow:
          description: Methods this endpoint supports.
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
    Internal:
      description: Unexpected server error (INTERNAL); details are only in the server log.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
